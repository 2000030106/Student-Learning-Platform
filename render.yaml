services:
  - type: web
    name: student-learning-platform
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-learning-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: student-learning-platform-db
    plan: free
    region: singapore
